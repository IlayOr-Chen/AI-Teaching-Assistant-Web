# ====================================================================
# Render Blueprint Deployment Configuration — AI Teaching Assistant Web
# ====================================================================
services:
  - type: web
    name: ai-teaching-assistant-web
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_DB_URL
        value: https://ai-teaching-assistant-web-default-rtdb.firebaseio.com/
      - key: FIREBASE_CREDENTIALS_PATH
        value: serviceAccountKey.json
      - key: USE_MOCK_FIREBASE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: LECTURER_EMAIL
        value: adminL@gmail.com
      - key: LECTURER_PASSWORD
        value: "12345"
      - key: LECTURER_NAME
        value: Course Lecturer
      - key: LECTURER_ACCESS_CODE
        value: TA-ADMIN-2026
      - key: QR_ROTATION_SECONDS
        value: "8"
      - key: QR_GRACE_SECONDS
        value: "7"
      - key: DEVICE_COOLDOWN_MINUTES
        value: "15"
      - key: ENFORCE_GEOFENCE_DEFAULT
        value: "true"
      - key: GEOFENCE_RADIUS_METERS
        value: "100"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: YOLO_MODEL_PATH
        value: yolov8n.pt
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: "0.30"
